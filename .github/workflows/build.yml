name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      flavor:
        description: Product flavor to build
        type: choice
        options: [ stable, unstable ]
        default: stable

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # fetch-depth 0 is required: build.gradle derives VERSION_NAME from
      # `git describe --tags` and VERSION_CODE from `git rev-list --count`,
      # both of which are wrong or fail on a shallow clone.
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      # `lfs: true` above does not recurse into submodules, and
      # java/assets/futo-swipe is a HuggingFace repo whose model files are LFS.
      - name: Fetch LFS content inside submodules
        run: git submodule foreach --recursive 'git lfs pull || true'

      - name: Derive version from git
        run: |
          echo "VERSION_NAME=$(git describe --tags)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Must match ndkVersion in build.gradle exactly or AGP re-downloads it.
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore and keystore.properties are gitignored, so they are not on
      # the runner. Without this step build.gradle silently falls back to the
      # public AOSP debug key instead of failing.
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is empty - refusing to produce a debug-signed release" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > ci-release.jks
          {
            echo "storeFile=ci-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew "assemble${FLAVOR^}Release" --stacktrace
        env:
          FLAVOR: ${{ inputs.flavor || 'stable' }}

      # A wrong password or alias does not fail the build - gradle just uses the
      # debug key - so assert the signer explicitly.
      - name: Verify signing key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          APK=$(ls build/outputs/apk/*/release/*.apk | head -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android, OU=Android, O=Android"; then
            echo "APK is signed with the AOSP debug key" >&2
            exit 1
          fi

      - name: Clean up signing material
        if: always()
        run: rm -f ci-release.jks keystore.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-eink-${{ inputs.flavor || 'stable' }}-release
          path: build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 30
