pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        flatDir {
            dirs 'libs'
        }
    }
}
// Pinned so APK/AAB output names don't depend on the checkout directory name.
rootProject.name = 'futo-keyboard-eink'

include ':voiceinput-shared'
